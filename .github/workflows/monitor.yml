name: Notifier Monitor

on:
  workflow_dispatch:
    inputs:
      force_test_email:
        description: 'TEMP DEBUG: force-send a recap email regardless of balance/new loans'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: swaper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Remove broken third-party apt repos (Azure CLI / Microsoft)
        run: |
          echo "Before cleanup:" 
          sudo ls -la /etc/apt/sources.list.d || true
          sudo grep -RinE "packages\.microsoft\.com|azure-cli" /etc/apt/sources.list /etc/apt/sources.list.d || true

          # GitHub runner images can ship these repos as either .list or .sources.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name "*microsoft*" -o -name "*azure*" \) -print -delete || true
          sudo sed -i '/packages.microsoft.com/d;/azure-cli/d' /etc/apt/sources.list || true

          echo "After cleanup:" 
          sudo ls -la /etc/apt/sources.list.d || true
          sudo grep -RinE "packages\.microsoft\.com|azure-cli" /etc/apt/sources.list /etc/apt/sources.list.d || true

          sudo apt-get update

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Restore persisted state (session cookies + seen loan IDs)
        uses: actions/cache/restore@v4
        with:
          path: |
            storage_state.json
            state.json
          key: swaper-state-${{ github.run_id }}
          restore-keys: |
            swaper-state-

      - name: Run monitor
        env:
          SWAPER_EMAIL: ${{ secrets.SWAPER_EMAIL }}
          SWAPER_PASSWORD: ${{ secrets.SWAPER_PASSWORD }}
          SWAPER_TOTP_SECRET: ${{ secrets.SWAPER_TOTP_SECRET }}
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          CRON_JOB_ID: ${{ secrets.CRON_JOB_ID }}
          CRON_JOB_TIMEZONE: ${{ secrets.CRON_JOB_TIMEZONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_TEST_EMAIL: ${{ github.event.inputs.force_test_email }}
        run: python main.py

      - name: Save persisted state (session cookies + seen loan IDs) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            storage_state.json
            state.json
          key: swaper-state-${{ github.run_id }}
