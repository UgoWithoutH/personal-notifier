name: Swaper Loan Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_test_email:
        description: 'TEMP DEBUG: force-send a recap email regardless of balance/new loans'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Restore persisted state (session cookies + seen loan IDs)
        uses: actions/cache/restore@v4
        with:
          path: |
            storage_state.json
            state.json
          key: swaper-state-${{ github.run_id }}
          restore-keys: |
            swaper-state-

      - name: Run monitor
        env:
          SWAPER_EMAIL: ${{ secrets.SWAPER_EMAIL }}
          SWAPER_PASSWORD: ${{ secrets.SWAPER_PASSWORD }}
          SWAPER_TOTP_SECRET: ${{ secrets.SWAPER_TOTP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_TEST_EMAIL: ${{ github.event.inputs.force_test_email }}
        run: python main.py

      - name: Save persisted state (session cookies + seen loan IDs) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            storage_state.json
            state.json
          key: swaper-state-${{ github.run_id }}
