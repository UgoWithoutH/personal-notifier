name: Swaper Monitor

on:
  workflow_dispatch:
    inputs:
      force_test_email:
        description: 'TEMP DEBUG: force-send a recap email regardless of balance/new loans'
        type: boolean
        default: false
      loop_max_hours:
        description: 'Sécurité : arrêt de la boucle d''investissement continue après ce nombre d''heures sans succès (GitHub Actions plafonne un job hébergé à 6h max quoi qu''il arrive, d''où le défaut à 1h)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: swaper-monitor
  cancel-in-progress: false

jobs:
  swaper:
    runs-on: ubuntu-22.04
    # GitHub-hosted runners hard-cap a single job at 6h (360min) regardless
    # of this value or SWAPER_LOOP_MAX_HOURS - kept explicit so the real
    # ceiling is visible here, not just implied by GitHub's own default.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Remove broken third-party apt repos (Azure CLI / Microsoft)
        run: |
          echo "Before cleanup:" 
          sudo ls -la /etc/apt/sources.list.d || true
          sudo grep -RinE "packages\.microsoft\.com|azure-cli" /etc/apt/sources.list /etc/apt/sources.list.d || true

          # GitHub runner images can ship these repos as either .list or .sources.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name "*microsoft*" -o -name "*azure*" \) -print -delete || true
          sudo sed -i '/packages.microsoft.com/d;/azure-cli/d' /etc/apt/sources.list || true

          echo "After cleanup:" 
          sudo ls -la /etc/apt/sources.list.d || true
          sudo grep -RinE "packages\.microsoft\.com|azure-cli" /etc/apt/sources.list /etc/apt/sources.list.d || true

          sudo apt-get update

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # "-v2" bump (2026-07-31): the previous cache was populated before
          # Playwright started shipping chrome-headless-shell as a separate
          # download, so headless launches failed with "Executable doesn't
          # exist" despite a cache hit. Bumping invalidates that stale entry.
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # Also re-run `playwright install` (not just install-deps): a cache
        # populated before Playwright started shipping the separate
        # chrome-headless-shell binary would otherwise never get it, since
        # the cache key (hash of requirements.txt) doesn't change - this is
        # a no-op download-wise if the binary is already present.
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restore persisted state (session cookies + seen loan IDs + cron schedule)
        uses: actions/cache/restore@v4
        with:
          path: |
            monitors/swaper_storage_state.json
            monitors/swaper_state.json
            monitors/cron_schedule_state.json
          key: swaper-state-${{ github.run_id }}
          restore-keys: |
            swaper-state-

      - name: Run Swaper monitor
        env:
          SWAPER_EMAIL: ${{ secrets.SWAPER_EMAIL }}
          SWAPER_PASSWORD: ${{ secrets.SWAPER_PASSWORD }}
          SWAPER_TOTP_SECRET: ${{ secrets.SWAPER_TOTP_SECRET }}
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          SWAPER_CRON_JOB_ID: ${{ secrets.SWAPER_CRON_JOB_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_TEST_EMAIL: ${{ github.event.inputs.force_test_email }}
          SWAPER_LOOP_MAX_HOURS: ${{ github.event.inputs.loop_max_hours }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python -m monitors.swaper_monitor

      - name: Save persisted state (session cookies + seen loan IDs + cron schedule) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            monitors/swaper_storage_state.json
            monitors/swaper_state.json
            monitors/cron_schedule_state.json
          key: swaper-state-${{ github.run_id }}
