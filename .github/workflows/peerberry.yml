name: PeerBerry Monitor

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: peerberry-monitor
  cancel-in-progress: false

jobs:
  peerberry:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - PeerBerry logs in via a pure-
      # HTTP replay of its login/2FA API flow instead (see
      # monitors/peerberry_monitor.py's module docstring) - just
      # `requests`/`pyotp`, already in requirements.txt. No session/cookie
      # persistence needed either (that login flow is lightweight enough to
      # run fresh every time) - only the notification-gate state and cron
      # schedule state are still persisted below.
      - name: Restore persisted state (last notified balance + cron schedule)
        uses: actions/cache/restore@v4
        with:
          path: |
            monitors/peerberry_cron_schedule_state.json
            monitors/peerberry_state.json
          key: peerberry-state-${{ github.run_id }}
          restore-keys: |
            peerberry-state-

      - name: Run PeerBerry monitor
        env:
          PEERBERRY_EMAIL: ${{ secrets.PEERBERRY_EMAIL }}
          PEERBERRY_PASSWORD: ${{ secrets.PEERBERRY_PASSWORD }}
          PEERBERRY_TOTP_SECRET: ${{ secrets.PEERBERRY_TOTP_SECRET }}
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          PEERBERRY_CRON_JOB_ID: ${{ secrets.PEERBERRY_CRON_JOB_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m monitors.peerberry_monitor

      - name: Save persisted state (last notified balance + cron schedule) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            monitors/peerberry_cron_schedule_state.json
            monitors/peerberry_state.json
          key: peerberry-state-${{ github.run_id }}
