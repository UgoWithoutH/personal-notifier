name: PeerBerry Monitor

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: peerberry-monitor
  cancel-in-progress: false

jobs:
  peerberry:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Remove broken third-party apt repos (Azure CLI / Microsoft)
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name "*microsoft*" -o -name "*azure*" \) -print -delete || true
          sudo sed -i '/packages.microsoft.com/d;/azure-cli/d' /etc/apt/sources.list || true
          sudo apt-get update

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Restore persisted state (session cookies)
        uses: actions/cache/restore@v4
        with:
          path: |
            monitors/peerberry_storage_state.json
          key: peerberry-state-${{ github.run_id }}
          restore-keys: |
            peerberry-state-

      - name: Run PeerBerry monitor
        env:
          PEERBERRY_EMAIL: ${{ secrets.PEERBERRY_EMAIL }}
          PEERBERRY_PASSWORD: ${{ secrets.PEERBERRY_PASSWORD }}
          PEERBERRY_TOTP_SECRET: ${{ secrets.PEERBERRY_TOTP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m monitors.peerberry_monitor

      - name: Save persisted state (session cookies) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            monitors/peerberry_storage_state.json
          key: peerberry-state-${{ github.run_id }}
