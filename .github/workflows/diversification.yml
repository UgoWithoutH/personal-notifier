name: Diversification Reports

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Mois de début de la plage à traiter (MM/AAAA). Laisser vide (avec end_month) pour utiliser la date du jour."
        required: false
        default: ""
      end_month:
        description: "Mois de fin de la plage à traiter (MM/AAAA, inclus). Laisser vide (avec start_month) pour utiliser la date du jour."
        required: false
        default: ""
      # All default to true so the cron-job.org trigger (which never sets
      # inputs, only relying on defaults) keeps running every platform -
      # decocher one here only affects a manual run.
      run_swaper:
        description: "Exécuter Swaper"
        type: boolean
        required: false
        default: true
      run_iuvo:
        description: "Exécuter Iuvo"
        type: boolean
        required: false
        default: true
      run_afranga:
        description: "Exécuter Afranga"
        type: boolean
        required: false
        default: true
      run_bienpreter:
        description: "Exécuter Bienprêter"
        type: boolean
        required: false
        default: true
      run_lendermarket:
        description: "Exécuter Lendermarket"
        type: boolean
        required: false
        default: true
      run_loanch:
        description: "Exécuter Loanch"
        type: boolean
        required: false
        default: true
      run_monefit:
        description: "Exécuter Monefit"
        type: boolean
        required: false
        default: true
      run_peerberry:
        description: "Exécuter PeerBerry"
        type: boolean
        required: false
        default: true
      run_goandgrow:
        description: "Exécuter Go & Grow"
        type: boolean
        required: false
        default: true
      run_bricks:
        description: "Exécuter Bricks"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  swaper:
    if: ${{ inputs.run_swaper }}
    runs-on: ubuntu-22.04
    concurrency:
      group: swaper-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Remove broken third-party apt repos (Azure CLI / Microsoft)
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name "*microsoft*" -o -name "*azure*" \) -print -delete || true
          sudo sed -i '/packages.microsoft.com/d;/azure-cli/d' /etc/apt/sources.list || true
          sudo apt-get update

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # "-v2" bump (2026-07-31): the previous cache was populated before
          # Playwright started shipping chrome-headless-shell as a separate
          # download, so headless launches failed with "Executable doesn't
          # exist" despite a cache hit. Bumping invalidates that stale entry.
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # Also re-run `playwright install` (not just install-deps): a cache
        # populated before Playwright started shipping the separate
        # chrome-headless-shell binary would otherwise never get it, since
        # the cache key (hash of requirements.txt) doesn't change - this is
        # a no-op download-wise if the binary is already present.
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restore persisted state (session cookies)
        uses: actions/cache/restore@v4
        with:
          path: |
            diversification/swaper_diversification_storage_state.json
            diversification/swaper_xirr_cashflows_state.json
          key: swaper-diversification-state-${{ github.run_id }}
          restore-keys: |
            swaper-diversification-state-

      - name: Run Swaper diversification report
        env:
          SWAPER_EMAIL: ${{ secrets.SWAPER_EMAIL }}
          SWAPER_PASSWORD: ${{ secrets.SWAPER_PASSWORD }}
          SWAPER_TOTP_SECRET: ${{ secrets.SWAPER_TOTP_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.swaper_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (session cookies) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            diversification/swaper_diversification_storage_state.json
            diversification/swaper_xirr_cashflows_state.json
          key: swaper-diversification-state-${{ github.run_id }}

  iuvo:
    needs: swaper
    if: ${{ always() && inputs.run_iuvo }}
    runs-on: ubuntu-22.04
    concurrency:
      group: iuvo-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Iuvo logs in via a
      # pure-HTTP replay of its legacy TeleBid/TB p2p login API instead
      # (see diversification/iuvo_diversification.py's module docstring) -
      # just `requests`, already in requirements.txt. No session/cookie
      # persistence needed for LOGIN (that flow is lightweight enough to
      # run fresh every time) - the XIRR cashflow cache below is unrelated
      # to login, it just avoids re-fetching the account's entire monthly
      # statement history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/iuvo_xirr_cashflows_state.json
          key: iuvo-diversification-state-${{ github.run_id }}
          restore-keys: |
            iuvo-diversification-state-

      - name: Run Iuvo diversification report
        env:
          IUVO_EMAIL: ${{ secrets.IUVO_EMAIL }}
          IUVO_PASSWORD: ${{ secrets.IUVO_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.iuvo_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/iuvo_xirr_cashflows_state.json
          key: iuvo-diversification-state-${{ github.run_id }}

  afranga:
    needs: iuvo
    if: ${{ always() && inputs.run_afranga }}
    runs-on: ubuntu-22.04
    concurrency:
      group: afranga-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Afranga logs in via a
      # pure-HTTP replay of its Laravel CSRF `_token` + TOTP login flow
      # instead (see diversification/afranga_diversification.py's module
      # docstring) - just `requests`/`pyotp`, already in requirements.txt.
      # No session/cookie persistence needed (that login flow is
      # lightweight enough to run fresh every time) - the XIRR cashflow
      # cache below is unrelated to login, it just avoids re-fetching the
      # account's entire Details history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/afranga_xirr_cashflows_state.json
          key: afranga-diversification-state-${{ github.run_id }}
          restore-keys: |
            afranga-diversification-state-

      - name: Run Afranga diversification report
        env:
          AFRANGA_EMAIL: ${{ secrets.AFRANGA_EMAIL }}
          AFRANGA_PASSWORD: ${{ secrets.AFRANGA_PASSWORD }}
          AFRANGA_TOTP_SECRET: ${{ secrets.AFRANGA_TOTP_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.afranga_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/afranga_xirr_cashflows_state.json
          key: afranga-diversification-state-${{ github.run_id }}

  bienpreter:
    needs: afranga
    if: ${{ always() && inputs.run_bienpreter }}
    runs-on: ubuntu-22.04
    concurrency:
      group: bienpreter-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Bienpreter logs in via a
      # pure-HTTP replay of its login form instead (see
      # diversification/bienpreter_diversification.py's module docstring) -
      # just `requests`, already in requirements.txt. No session/cookie
      # persistence needed for login (that flow is lightweight enough to
      # run fresh every time) - the XIRR cashflow cache below is unrelated
      # to login, it just avoids re-fetching the account's entire
      # /u/operations history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/bienpreter_xirr_cashflows_state.json
          key: bienpreter-diversification-state-${{ github.run_id }}
          restore-keys: |
            bienpreter-diversification-state-

      - name: Run Bienpreter diversification report
        env:
          BIENPRETER_EMAIL: ${{ secrets.BIENPRETER_EMAIL }}
          BIENPRETER_PASSWORD: ${{ secrets.BIENPRETER_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.bienpreter_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/bienpreter_xirr_cashflows_state.json
          key: bienpreter-diversification-state-${{ github.run_id }}

  lendermarket:
    needs: bienpreter
    if: ${{ always() && inputs.run_lendermarket }}
    runs-on: ubuntu-22.04
    concurrency:
      group: lendermarket-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Lendermarket logs in via a
      # pure-HTTP replay of its CSRF/XSRF + TOTP login flow instead (see
      # monitors/lendermarket_monitor.py's module docstring) - just
      # `requests`/`pyotp`, already in requirements.txt. No session/cookie
      # persistence needed for LOGIN (that flow is lightweight enough to
      # run fresh every time) - the XIRR cache below is unrelated to
      # login, it just avoids re-fetching the account's entire monthly
      # statement history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/lendermarket_xirr_cashflows_state.json
          key: lendermarket-diversification-state-${{ github.run_id }}
          restore-keys: |
            lendermarket-diversification-state-

      - name: Run Lendermarket diversification report
        env:
          LENDERMARKET_EMAIL: ${{ secrets.LENDERMARKET_EMAIL }}
          LENDERMARKET_PASSWORD: ${{ secrets.LENDERMARKET_PASSWORD }}
          LENDERMARKET_TOTP_SECRET: ${{ secrets.LENDERMARKET_TOTP_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.lendermarket_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/lendermarket_xirr_cashflows_state.json
          key: lendermarket-diversification-state-${{ github.run_id }}

  loanch:
    needs: lendermarket
    if: ${{ always() && inputs.run_loanch }}
    runs-on: ubuntu-22.04
    concurrency:
      group: loanch-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Loanch logs in via a
      # pure-HTTP replay of its django-allauth "headless" login/2FA API
      # flow instead (see diversification/loanch_diversification.py's
      # module docstring) - just `requests`/`pyotp`, already in
      # requirements.txt. No session/cookie persistence needed for LOGIN
      # (that flow is lightweight enough to run fresh every time) - the
      # XIRR cashflow cache below is unrelated to login, it just avoids
      # re-fetching the account's entire transaction ledger every run.
      # The login endpoints were confirmed with a real network capture on
      # 2026-07-27 (see the module docstring).

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/loanch_xirr_cashflows_state.json
          key: loanch-diversification-state-${{ github.run_id }}
          restore-keys: |
            loanch-diversification-state-

      - name: Run Loanch diversification report
        env:
          LOANCH_EMAIL: ${{ secrets.LOANCH_EMAIL }}
          LOANCH_PASSWORD: ${{ secrets.LOANCH_PASSWORD }}
          LOANCH_TOTP_SECRET: ${{ secrets.LOANCH_TOTP_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.loanch_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/loanch_xirr_cashflows_state.json
          key: loanch-diversification-state-${{ github.run_id }}

  monefit:
    needs: loanch
    if: ${{ always() && inputs.run_monefit }}
    runs-on: ubuntu-22.04
    concurrency:
      group: monefit-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Monefit logs in via a
      # pure-HTTP replay of its login API instead (see
      # diversification/monefit_diversification.py's module docstring) -
      # just `requests`, already in requirements.txt. No session/cookie
      # persistence needed for LOGIN (that flow is lightweight enough to
      # run fresh every time). No 2FA on this account, so
      # MONEFIT_TOTP_SECRET is no longer needed - the XIRR cashflow cache
      # below is unrelated to login, it just avoids re-fetching the
      # account's entire monthly statement history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/monefit_xirr_cashflows_state.json
          key: monefit-diversification-state-${{ github.run_id }}
          restore-keys: |
            monefit-diversification-state-

      - name: Run Monefit diversification report
        env:
          MONEFIT_EMAIL: ${{ secrets.MONEFIT_EMAIL }}
          MONEFIT_PASSWORD: ${{ secrets.MONEFIT_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.monefit_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/monefit_xirr_cashflows_state.json
          key: monefit-diversification-state-${{ github.run_id }}

  peerberry:
    needs: monefit
    if: ${{ always() && inputs.run_peerberry }}
    runs-on: ubuntu-22.04
    concurrency:
      group: peerberry-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - PeerBerry logs in via a
      # pure-HTTP replay of its login/2FA API flow instead (see
      # monitors/peerberry_monitor.py's module docstring) - just
      # `requests`/`pyotp`, already in requirements.txt. No session/cookie
      # persistence needed for LOGIN (that flow is lightweight enough to
      # run fresh every time) - the XIRR cashflow cache below is unrelated
      # to login, it just avoids re-fetching the account's entire
      # transaction history every run.

      - name: Restore persisted state (XIRR cashflow cache)
        uses: actions/cache/restore@v4
        with:
          path: diversification/peerberry_xirr_cashflows_state.json
          key: peerberry-diversification-state-${{ github.run_id }}
          restore-keys: |
            peerberry-diversification-state-

      - name: Run PeerBerry diversification report
        env:
          PEERBERRY_EMAIL: ${{ secrets.PEERBERRY_EMAIL }}
          PEERBERRY_PASSWORD: ${{ secrets.PEERBERRY_PASSWORD }}
          PEERBERRY_TOTP_SECRET: ${{ secrets.PEERBERRY_TOTP_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.peerberry_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

      - name: Save persisted state (XIRR cashflow cache) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: diversification/peerberry_xirr_cashflows_state.json
          key: peerberry-diversification-state-${{ github.run_id }}

  goandgrow:
    needs: peerberry
    if: ${{ always() && inputs.run_goandgrow }}
    runs-on: ubuntu-22.04
    concurrency:
      group: goandgrow-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Go & Grow's Cloudflare
      # bot-management blocks Playwright/CDP-driven navigation
      # unconditionally, so this platform logs in via a pure-HTTP replay
      # of its Keycloak/OIDC login flow instead (see
      # diversification/goandgrow_diversification.py's module docstring)
      # - just `requests`, already in requirements.txt. No session/cookie
      # persistence either (that login flow is lightweight enough to run
      # fresh every time).
      - name: Run Go & Grow diversification report
        env:
          GOANDGROW_EMAIL: ${{ secrets.GOANDGROW_EMAIL }}
          GOANDGROW_PASSWORD: ${{ secrets.GOANDGROW_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.goandgrow_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

  bricks:
    needs: goandgrow
    if: ${{ always() && inputs.run_bricks }}
    runs-on: ubuntu-22.04
    concurrency:
      group: bricks-diversification
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install needed - Bricks logs in via a
      # pure-HTTP replay of its sign-in API instead (see
      # diversification/bricks_diversification.py's module docstring) -
      # just `requests`, already in requirements.txt. No session/cookie
      # persistence either (that login flow is lightweight enough to run
      # fresh every time).
      - name: Run Bricks diversification report
        env:
          BRICKS_EMAIL: ${{ secrets.BRICKS_EMAIL }}
          BRICKS_PASSWORD: ${{ secrets.BRICKS_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: bash scripts/run_diversification_for_month_range.sh diversification.bricks_diversification "${{ github.event.inputs.start_month }}" "${{ github.event.inputs.end_month }}"

  recap_email:
    needs: bricks
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Runs after every platform job above ("if: always()", regardless of
      # any individual job's success/failure) - re-reads each platform's
      # already-written "non investi" row from the Sheet and sends one
      # recap email (see scripts/send_diversification_recap_email.py).
      - name: Send uninvested amounts recap email
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m scripts.send_diversification_recap_email